services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: lost-found-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in docker/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in docker/.env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY:?Set AUTOMATION_API_KEY in docker/.env}
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost}
      PORT: 3000
      UPLOAD_DIR: /app/uploads
    expose:
      - '3000'
    volumes:
      - uploaded_files:/app/uploads
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy

  backend-seed:
    image: lost-found-backend:local
    restart: 'no'
    command: ['npm', 'run', 'db:seed']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in docker/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in docker/.env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
    networks:
      - data
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '8080'
    networks:
      - app

  n8n:
    image: n8nio/n8n:2.43.7
    restart: unless-stopped
    environment:
      N8N_HOST: ${APP_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: ${N8N_ORIGIN:-http://localhost:5678}/
      N8N_WEBHOOK_URL: ${N8N_ORIGIN:-http://localhost:5678}/
      N8N_PROXY_HOPS: 0
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in docker/.env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 168
      GENERIC_TIMEZONE: Africa/Tunis
      TZ: Africa/Tunis
      AUTOMATION_API_KEY: ${AUTOMATION_API_KEY:?Set AUTOMATION_API_KEY in docker/.env}
    ports:
      - '127.0.0.1:${N8N_PUBLIC_PORT:-5678}:5678'
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-80}:8080'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      n8n:
        condition: service_started

volumes:
  postgres_data:
  uploaded_files:
  n8n_data:

networks:
  app:
  data:
    internal: true
