<section class="admin-page"><div class="heading"><span>Référentiel</span><h1>Catégories</h1><p>Gérez les catégories disponibles lors de la publication.</p></div>@if(errorMessage){<p class="error-message">{{ errorMessage }}</p>}<div class="panel references"><div class="add-row"><input [(ngModel)]="newCategory" placeholder="Nouvelle catégorie"><button class="btn btn-primary" (click)="add()">Ajouter</button></div>@for(category of categories;track category.id){<div class="reference"><span>{{ category.name }}</span><button class="btn btn-danger" (click)="remove(category)">Supprimer</button></div>}</div></section>
