<section class="admin-page"><div class="heading"><span>Administration</span><h1>Utilisateurs</h1><p>Gérez les rôles des comptes enregistrés.</p></div>@if(errorMessage){<p class="error-message">{{ errorMessage }}</p>}<div class="table-wrap"><table><thead><tr><th>Utilisateur</th><th>Email</th><th>Rôle</th></tr></thead><tbody>@for(user of users;track user.id){<tr><td>{{ user.name }}</td><td>{{ user.email }}</td><td><select [ngModel]="user.role" (ngModelChange)="changeRole(user, $event)"><option value="USER">USER</option><option value="ADMIN">ADMIN</option></select></td></tr>}@empty{<tr><td colspan="3">Aucun utilisateur.</td></tr>}</tbody></table></div></section>
